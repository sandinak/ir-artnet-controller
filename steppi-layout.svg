<svg viewBox="0 0 980 600" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif" role="img">
<title>Step Pi HAT connector map and status pod (unified)</title>
<desc>Corrected step-Pi layout. Status LEDs (green power GPIO17, yellow ArtNet GPIO27, red network GPIO22) live on a swappable universal pod connected by J_STAT (4-pin JST-XH). Pixelblaze data is on GPIO14 via J_PB (3-pin). GPIO14 is NOT used for the console. An optional UART3 debug header uses GPIO4/GPIO5.</desc>
<rect x="0" y="0" width="980" height="600" fill="#ffffff"/>

<!-- ===== HAT board ===== -->
<rect x="20" y="24" width="660" height="552" rx="16" fill="#1f5c43" stroke="#123b2b" stroke-width="3"/>
<text x="40" y="52" fill="#d8efe4" font-size="15" font-weight="700">Step Pi — custom HAT (Perma-Proto prototype shown)</text>

<!-- header -->
<rect x="60" y="64" width="600" height="50" rx="6" fill="#0f2c20"/>
<g fill="#e8c84a">
<circle cx="80" cy="78" r="5"/><circle cx="80" cy="100" r="5"/>
<circle cx="110" cy="78" r="5"/><circle cx="110" cy="100" r="5"/>
<circle cx="140" cy="78" r="5"/>
<circle cx="320" cy="100" r="5"/>
<circle cx="380" cy="78" r="5"/><circle cx="380" cy="100" r="5"/>
<circle cx="410" cy="78" r="5"/><circle cx="410" cy="100" r="5"/>
<circle cx="440" cy="78" r="5"/><circle cx="440" cy="100" r="5"/>
<circle cx="470" cy="78" r="5"/><circle cx="470" cy="100" r="5"/>
<circle cx="530" cy="78" r="5"/><circle cx="530" cy="100" r="5"/>
<circle cx="560" cy="78" r="5"/><circle cx="560" cy="100" r="5"/>
<circle cx="590" cy="78" r="5"/><circle cx="590" cy="100" r="5"/>
<circle cx="620" cy="78" r="5"/><circle cx="620" cy="100" r="5"/>
<circle cx="650" cy="78" r="5"/><circle cx="650" cy="100" r="5"/>
</g>
<!-- highlighted pins -->
<!-- 5V pin2, GND pin6, GPIO14 pin8, GPIO4 pin7, GND pin9 -->
<circle cx="80" cy="100" r="8" fill="#d23b2b" stroke="#fff" stroke-width="2"/>
<circle cx="140" cy="100" r="8" fill="#111" stroke="#fff" stroke-width="2"/>
<circle cx="170" cy="100" r="8" fill="#2b6fd2" stroke="#fff" stroke-width="2"/>
<circle cx="170" cy="78" r="8" fill="#8a4fb0" stroke="#fff" stroke-width="2"/>
<circle cx="200" cy="78" r="8" fill="#111" stroke="#fff" stroke-width="2"/>
<!-- LED gpios pin11/13/15 + GND pin20 -->
<circle cx="230" cy="78" r="8" fill="#2ea44f" stroke="#fff" stroke-width="2"/>
<circle cx="260" cy="78" r="8" fill="#e0b21f" stroke="#fff" stroke-width="2"/>
<circle cx="290" cy="78" r="8" fill="#d23b2b" stroke="#fff" stroke-width="2"/>
<circle cx="350" cy="100" r="8" fill="#111" stroke="#fff" stroke-width="2"/>
<!-- GPIO5 pin29 -->
<circle cx="500" cy="78" r="8" fill="#8a4fb0" stroke="#fff" stroke-width="2"/>
<g font-size="8" fill="#0f2c20" font-weight="700" text-anchor="middle">
<text x="80" y="103">2</text><text x="140" y="103">6</text><text x="170" y="103">8</text>
<text x="170" y="81">7</text><text x="200" y="81">9</text>
<text x="230" y="81">11</text><text x="260" y="81">13</text><text x="290" y="81">15</text>
<text x="350" y="103">20</text><text x="500" y="81">29</text>
</g>
<g font-size="8.5" fill="#cfe6da">
<text x="150" y="132">GPIO14=PB</text><text x="228" y="132">17</text><text x="258" y="132">27</text><text x="286" y="132">22</text>
<text x="486" y="70">GPIO5</text><text x="156" y="70">GPIO4</text>
</g>

<!-- ===== J_STAT connector ===== -->
<rect x="210" y="360" width="110" height="34" rx="4" fill="#20201f" stroke="#000"/>
<text x="265" y="352" fill="#d8efe4" font-size="12" text-anchor="middle" font-weight="700">J_STAT (JST-XH 4)</text>
<g fill="#e8c84a"><rect x="220" y="366" width="10" height="22"/><rect x="245" y="366" width="10" height="22"/><rect x="270" y="366" width="10" height="22"/><rect x="295" y="366" width="10" height="22"/></g>
<g font-size="8" fill="#cfe6da" text-anchor="middle"><text x="225" y="404">G17</text><text x="250" y="404">G27</text><text x="275" y="404">G22</text><text x="300" y="404">GND</text></g>
<!-- wires header->J_STAT -->
<line x1="230" y1="78" x2="230" y2="366" stroke="#2ea44f" stroke-width="2.5"/>
<line x1="260" y1="78" x2="260" y2="366" stroke="#e0b21f" stroke-width="2.5"/>
<line x1="290" y1="78" x2="290" y2="366" stroke="#d23b2b" stroke-width="2.5"/>
<polyline points="350,100 350,340 300,340 300,366" fill="none" stroke="#111" stroke-width="2.5"/>

<!-- ===== J_PB connector ===== -->
<rect x="70" y="360" width="96" height="34" rx="4" fill="#20201f" stroke="#000"/>
<text x="118" y="352" fill="#d8efe4" font-size="12" text-anchor="middle" font-weight="700">J_PB (JST-XH 3)</text>
<g fill="#e8c84a"><rect x="80" y="366" width="10" height="22"/><rect x="112" y="366" width="10" height="22"/><rect x="144" y="366" width="10" height="22"/></g>
<g font-size="8" fill="#cfe6da" text-anchor="middle"><text x="85" y="404">5V</text><text x="117" y="404">G14</text><text x="149" y="404">GND</text></g>
<line x1="80" y1="100" x2="80" y2="366" stroke="#d23b2b" stroke-width="2.5"/>
<polyline points="170,100 170,330 117,330 117,366" fill="none" stroke="#2b6fd2" stroke-width="2.5"/>
<polyline points="140,100 140,320 149,320 149,366" fill="none" stroke="#111" stroke-width="2.5"/>
<text x="118" y="424" fill="#bcd6ff" font-size="9" text-anchor="middle">→ Pixelblaze data (2 Mbaud)</text>
<text x="118" y="437" fill="#ffd9a8" font-size="9" text-anchor="middle">GPIO14 — never the console</text>

<!-- ===== optional debug header ===== -->
<rect x="430" y="360" width="96" height="34" rx="4" fill="#12352790" stroke="#5c8f78" stroke-dasharray="4 3"/>
<text x="478" y="352" fill="#cfe6da" font-size="11" text-anchor="middle" font-weight="700">J_DBG (opt UART3)</text>
<g fill="#c9a06a"><rect x="440" y="366" width="10" height="22"/><rect x="472" y="366" width="10" height="22"/><rect x="504" y="366" width="10" height="22"/></g>
<g font-size="8" fill="#cfe6da" text-anchor="middle"><text x="445" y="404">TX4</text><text x="477" y="404">RX5</text><text x="509" y="404">GND</text></g>
<polyline points="170,78 170,200 445,200 445,366" fill="none" stroke="#8a4fb0" stroke-width="2" stroke-dasharray="5 4"/>
<line x1="500" y1="78" x2="500" y2="366" stroke="#8a4fb0" stroke-width="2" stroke-dasharray="5 4"/>
<text x="478" y="424" fill="#cfe6da" font-size="9" text-anchor="middle">optional on-HAT console</text>
<text x="478" y="437" fill="#cfe6da" font-size="9" text-anchor="middle">(primary = USB-TTL/SSH)</text>

<!-- ===== universal status pod ===== -->
<rect x="710" y="60" width="250" height="470" rx="14" fill="#123b2b" stroke="#0c2a1f" stroke-width="2"/>
<text x="835" y="88" fill="#d8efe4" font-size="13" text-anchor="middle" font-weight="700">UNIVERSAL STATUS POD</text>
<text x="835" y="106" fill="#8fb8a6" font-size="10" text-anchor="middle">same PCB as the IR emitter pod</text>
<!-- 4-pin input -->
<rect x="785" y="122" width="100" height="26" rx="4" fill="#20201f" stroke="#000"/>
<text x="835" y="140" fill="#e8c84a" font-size="10" text-anchor="middle" font-weight="700">JST-XH 4-pin in</text>
<!-- three LED chains -->
<!-- green -->
<line x1="800" y1="148" x2="800" y2="190" stroke="#2ea44f" stroke-width="2.5"/>
<rect x="792" y="190" width="16" height="34" rx="3" fill="#e7dcc2" stroke="#8a7a52"/>
<polygon points="790,238 810,238 800,256" fill="#2ea44f"/><line x1="788" y1="258" x2="812" y2="258" stroke="#2ea44f" stroke-width="3"/>
<line x1="800" y1="224" x2="800" y2="238" stroke="#2ea44f" stroke-width="2.5"/>
<line x1="800" y1="258" x2="800" y2="470" stroke="#2ea44f" stroke-width="2.5"/>
<text x="800" y="286" fill="#bfeccb" font-size="10" text-anchor="middle" font-weight="700">Power</text>
<text x="800" y="299" fill="#8fb8a6" font-size="8" text-anchor="middle">green 220Ω</text>
<!-- yellow -->
<line x1="835" y1="148" x2="835" y2="190" stroke="#e0b21f" stroke-width="2.5"/>
<rect x="827" y="190" width="16" height="34" rx="3" fill="#e7dcc2" stroke="#8a7a52"/>
<polygon points="825,238 845,238 835,256" fill="#e0b21f"/><line x1="823" y1="258" x2="847" y2="258" stroke="#e0b21f" stroke-width="3"/>
<line x1="835" y1="224" x2="835" y2="238" stroke="#e0b21f" stroke-width="2.5"/>
<line x1="835" y1="258" x2="835" y2="470" stroke="#e0b21f" stroke-width="2.5"/>
<text x="835" y="316" fill="#f2dd97" font-size="10" text-anchor="middle" font-weight="700">ArtNet</text>
<text x="835" y="329" fill="#8fb8a6" font-size="8" text-anchor="middle">yellow 220Ω</text>
<!-- red -->
<line x1="870" y1="148" x2="870" y2="190" stroke="#d23b2b" stroke-width="2.5"/>
<rect x="862" y="190" width="16" height="34" rx="3" fill="#e7dcc2" stroke="#8a7a52"/>
<polygon points="860,238 880,238 870,256" fill="#d23b2b"/><line x1="858" y1="258" x2="882" y2="258" stroke="#d23b2b" stroke-width="3"/>
<line x1="870" y1="224" x2="870" y2="238" stroke="#d23b2b" stroke-width="2.5"/>
<line x1="870" y1="258" x2="870" y2="470" stroke="#d23b2b" stroke-width="2.5"/>
<text x="870" y="346" fill="#f6b3ab" font-size="10" text-anchor="middle" font-weight="700">Network</text>
<text x="870" y="359" fill="#8fb8a6" font-size="8" text-anchor="middle">red 220Ω</text>
<!-- pod GND rail -->
<rect x="770" y="470" width="130" height="8" rx="4" fill="#2b6fd2"/>
<text x="835" y="496" fill="#a9c8ff" font-size="10" text-anchor="middle" font-weight="700">GND</text>

<!-- cable J_STAT -> pod -->
<path d="M320 377 C 560 377, 560 135, 785 135" fill="none" stroke="#e8c84a" stroke-width="2.5" stroke-dasharray="2 4"/>
<text x="560" y="250" fill="#8a7a52" font-size="10" text-anchor="middle">JST-XH cable</text>

<!-- legend -->
<rect x="40" y="470" width="360" height="96" rx="8" fill="#0f2c20"/>
<text x="56" y="492" fill="#d8efe4" font-size="12" font-weight="700">Unified with the step redesign:</text>
<g fill="#cfe6da" font-size="10">
<text x="56" y="512">• LEDs live on the swappable pod (J_STAT), red/yellow/green.</text>
<text x="56" y="528">• GPIO14 = Pixelblaze data (J_PB). Not the console.</text>
<text x="56" y="544">• Console: USB-TTL / SSH (off-HAT); UART3 header optional.</text>
<text x="56" y="560">• IR moved to the towers — no IR channels populated here.</text>
</g>
</svg>

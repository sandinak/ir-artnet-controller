---
# Deploy the ArtNet IR tower daemon to a Raspberry Pi.
# Fits the sandinak/ansible-raspi-dmx fleet paradigm: no HAT EEPROM,
# device-tree overlays and config live in config.txt / files managed here.

- name: Install system dependencies
  become: true
  ansible.builtin.apt:
    name:
      - v4l-utils           # provides ir-ctl (the default backend)
      - python3-venv        # the daemon runs from its own venv
      - python3-pip
      - python3-gpiozero    # status-LED helper; apt-only (needs a C GPIO backend)
      - acl                 # lets Ansible become an unprivileged user for the venv tasks
    state: present
    update_cache: true
    cache_valid_time: 3600

- name: Install pigpio (only if using the pigpio fallback backend)
  become: true
  ansible.builtin.apt:
    name: [pigpio, python3-pigpio]
    state: present
  when: transmit_backend == 'pigpio'

- name: Ensure install directory exists
  become: true
  ansible.builtin.file:
    path: "{{ ir_artnet_dir }}"
    state: directory
    owner: "{{ ir_artnet_user }}"
    mode: "0755"

# Raspberry Pi OS Bookworm/Trixie are PEP 668 externally-managed: pip cannot write
# to the system interpreter at all. The venv is built with --system-site-packages
# so the apt-provided C-extension packages (python3-gpiozero, python3-pigpio) stay
# visible, while anything pip installs here shadows the system copy.
# pip's `requirements` path is resolved on the TARGET, so ship the file first.
- name: Deploy requirements.txt
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../requirements.txt"
    dest: "{{ ir_artnet_dir }}/requirements.txt"
    owner: "{{ ir_artnet_user }}"
    mode: "0644"

- name: Create the venv and install Python dependencies into it
  become: true
  become_user: "{{ ir_artnet_user }}"
  ansible.builtin.pip:
    requirements: "{{ ir_artnet_dir }}/requirements.txt"
    virtualenv: "{{ ir_artnet_venv }}"
    virtualenv_command: "python3 -m venv --system-site-packages"
  notify: restart ir-artnet

- name: Ensure the package directory exists
  become: true
  ansible.builtin.file:
    path: "{{ ir_artnet_dir }}/ir_artnet"
    state: directory
    owner: "{{ ir_artnet_user }}"
    mode: "0755"

# Copy the sources only. A bare directory copy would also push the dev
# machine's __pycache__/, whose .pyc files are built for the wrong Python ABI.
- name: Deploy ir_artnet package sources
  become: true
  ansible.builtin.copy:
    src: "{{ item }}"
    dest: "{{ ir_artnet_dir }}/ir_artnet/"
    owner: "{{ ir_artnet_user }}"
    mode: "0644"
  with_fileglob:
    - "{{ playbook_dir }}/../ir_artnet/*.py"
  notify: restart ir-artnet

- name: Remove any stale bytecode cache on the tower
  become: true
  ansible.builtin.file:
    path: "{{ ir_artnet_dir }}/ir_artnet/__pycache__"
    state: absent

- name: Deploy captured remotes (.ir files)
  become: true
  ansible.builtin.copy:
    src: "{{ playbook_dir }}/../remotes/"
    dest: "{{ ir_artnet_dir }}/remotes/"
    owner: "{{ ir_artnet_user }}"
    mode: "0644"
    directory_mode: "0755"
  notify: restart ir-artnet

- name: Template the tower config
  become: true
  ansible.builtin.template:
    src: config.candles.yaml.j2
    dest: "{{ ir_artnet_dir }}/config.yaml"
    owner: "{{ ir_artnet_user }}"
    mode: "0644"
  notify: restart ir-artnet

- name: Enable the gpio-ir-tx overlay in config.txt
  become: true
  ansible.builtin.lineinfile:
    path: "{{ boot_config_path }}"
    regexp: '^dtoverlay=gpio-ir-tx'
    line: "dtoverlay=gpio-ir-tx,gpio_pin={{ ir_gpio_pin }}"
  when: transmit_backend == 'ir-ctl'
  register: ir_overlay
  notify: reboot pi

# The service runs unprivileged, so it must be able to open the LIRC chardev.
# Raspberry Pi OS ships /dev/lirc0 as root:video 0660; this makes that explicit
# so a non-default ir_artnet_user still works.
- name: Grant the service user access to the LIRC device
  become: true
  ansible.builtin.user:
    name: "{{ ir_artnet_user }}"
    groups: video
    append: true
  when: transmit_backend == 'ir-ctl'

- name: Install a udev rule pinning LIRC device ownership
  become: true
  ansible.builtin.copy:
    dest: /etc/udev/rules.d/99-ir-artnet-lirc.rules
    content: |
      # MANAGED BY ANSIBLE (role: ir_artnet_tower)
      SUBSYSTEM=="lirc", GROUP="video", MODE="0660"
    mode: "0644"
  when: transmit_backend == 'ir-ctl'
  notify: reload udev

- name: Enable pigpiod (only for the pigpio backend)
  become: true
  ansible.builtin.systemd:
    name: pigpiod
    enabled: true
    state: started
  when: transmit_backend == 'pigpio'

- name: Install the systemd unit
  become: true
  ansible.builtin.template:
    src: ir-artnet.service.j2
    dest: /etc/systemd/system/ir-artnet.service
    mode: "0644"
  notify:
    - reload systemd
    - restart ir-artnet

- name: Verify the venv can load the deployed config
  become: true
  become_user: "{{ ir_artnet_user }}"
  ansible.builtin.command:
    cmd: "{{ ir_artnet_python }} -m ir_artnet --config {{ ir_artnet_dir }}/config.yaml --list"
    chdir: "{{ ir_artnet_dir }}"
  register: ir_artnet_check
  changed_when: false

- name: Show the commands this tower can fire
  ansible.builtin.debug:
    var: ir_artnet_check.stdout_lines

- name: Enable and start the service
  become: true
  ansible.builtin.systemd:
    name: ir-artnet
    enabled: true
    state: started
    daemon_reload: true

- name: Warn if a reboot is still required for /dev/lirc0
  ansible.builtin.debug:
    msg: >-
      gpio-ir-tx overlay was (re)written but allow_reboot is false.
      Reboot {{ inventory_hostname }} so {{ lirc_device }} appears, then the
      service will transmit. (Set allow_reboot: true to automate this.)
  when:
    - transmit_backend == 'ir-ctl'
    - ir_overlay.changed | default(false)
    - not (allow_reboot | bool)

# --- Optional: join the show WiFi (unicast Art-Net target) ----------------
- name: Configure show WiFi (NetworkManager)
  become: true
  community.general.nmcli:
    type: wifi
    conn_name: "{{ wifi_conn_name }}"
    ifname: "{{ wifi_ifname }}"
    ssid: "{{ wifi_ssid }}"
    wifi_sec:
      key-mgmt: wpa-psk
      psk: "{{ wifi_psk }}"
    method4: "{{ 'manual' if tower_static_ip is defined else 'auto' }}"
    ip4: "{{ tower_static_ip | default(omit) }}"
    gw4: "{{ tower_gateway | default(omit) }}"
    dns4: "{{ tower_dns | default(omit) }}"
    autoconnect: true
    state: present
  when: wifi_ssid is defined

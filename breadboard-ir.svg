<svg viewBox="0 0 960 640" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif" role="img">
<title>Tower IR driver — breadboard wiring</title>
<desc>Breadboard build of the tower IR driver: Pi GPIO18 through a 220 ohm gate resistor into an IRLB8721 logic-level MOSFET (TO-220), 10k gate pulldown, source to the negative rail, drain switching an IR LED string fed from a 12V bench supply. Pi ground and 12V ground share the negative rail.</desc>

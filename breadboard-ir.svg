<rect x="24" y="250" width="150" height="150" rx="10" fill="#eef1f4" stroke="#8a8a8a"/>
<text x="99" y="276" fill="#222" font-size="13" font-weight="700" text-anchor="middle">Raspberry Pi</text>
<text x="99" y="292" fill="#666" font-size="9" text-anchor="middle">gpio-ir-tx on GPIO18</text>
<circle cx="174" cy="320" r="4" fill="#e8811f"/><text x="164" y="324" fill="#222" font-size="11" text-anchor="end" font-weight="700">GPIO18</text>
<circle cx="174" cy="360" r="4" fill="#111"/><text x="164" y="364" fill="#222" font-size="11" text-anchor="end" font-weight="700">GND</text>
<rect x="24" y="80" width="150" height="70" rx="10" fill="#eef1f4" stroke="#8a8a8a"/>
<text x="99" y="106" fill="#222" font-size="13" font-weight="700" text-anchor="middle">12 V bench PSU</text>
<circle cx="174" cy="120" r="4" fill="#d23b2b"/><text x="164" y="124" fill="#222" font-size="11" text-anchor="end" font-weight="700">+12V</text>
<circle cx="150" cy="150" r="4" fill="#111"/><text x="140" y="150" fill="#222" font-size="10" text-anchor="end">GND</text>
<rect x="210" y="70" width="730" height="500" rx="12" fill="#f2eee3" stroke="#c9c1ab" stroke-width="2"/>
<rect x="230" y="92" width="690" height="6" rx="3" fill="#d23b2b"/><text x="224" y="98" fill="#d23b2b" font-size="12" text-anchor="end" font-weight="700">+</text>
<rect x="230" y="112" width="690" height="6" rx="3" fill="#2b6fd2"/><text x="224" y="118" fill="#2b6fd2" font-size="12" text-anchor="end" font-weight="700">–</text>
<rect x="230" y="524" width="690" height="6" rx="3" fill="#d23b2b"/>
<rect x="230" y="544" width="690" height="6" rx="3" fill="#2b6fd2"/><text x="224" y="550" fill="#2b6fd2" font-size="12" text-anchor="end" font-weight="700">–</text>

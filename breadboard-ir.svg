<text x="775" y="412" fill="#666" font-size="9" text-anchor="middle">LED+ = +rail · LED– = drain</text>
<rect x="24" y="430" width="150" height="180" rx="10" fill="none" stroke="#8a8a8a"/>
<text x="36" y="452" fill="#222" font-size="11" font-weight="700">Wires</text>

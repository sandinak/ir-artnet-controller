<g><circle cx="260" cy="260" r="3"/><circle cx="290" cy="260" r="3"/><circle cx="320" cy="260" r="3"/><circle cx="350" cy="260" r="3"/><circle cx="380" cy="260" r="3"/><circle cx="410" cy="260" r="3"/><circle cx="440" cy="260" r="3"/><circle cx="470" cy="260" r="3"/><circle cx="500" cy="260" r="3"/><circle cx="530" cy="260" r="3"/><circle cx="560" cy="260" r="3"/><circle cx="590" cy="260" r="3"/><circle cx="620" cy="260" r="3"/><circle cx="650" cy="260" r="3"/><circle cx="680" cy="260" r="3"/><circle cx="710" cy="260" r="3"/></g>

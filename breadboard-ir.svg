<line x1="36" y1="488" x2="60" y2="488" stroke="#111" stroke-width="4"/><text x="66" y="492" fill="#555" font-size="10">ground (–)</text>
<line x1="36" y1="508" x2="60" y2="508" stroke="#d23b2b" stroke-width="4"/><text x="66" y="512" fill="#555" font-size="10">+12 V</text>

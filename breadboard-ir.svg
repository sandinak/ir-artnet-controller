<text x="36" y="568" fill="#222" font-size="9">share the – rail.</text>
<text x="36" y="586" fill="#b06a10" font-size="9">Prod HAT: AO3400A</text>
<text x="36" y="598" fill="#b06a10" font-size="9">(SMD) replaces Q1.</text>

<svg viewBox="0 0 960 660" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif" role="img">
<title>Raspberry Pi HAT solder layout</title>
<desc>Top-down placement diagram for the proto HAT. GPIO18 (header pin 12) goes through R1 to the MOSFET Q1 gate; R2 pulls the gate to the ground rail. Q1 source ties to ground, Q1 drain goes to the LED- screw terminal. A 4-position screw terminal carries 12V and the emitter-head cable.</desc>

<svg viewBox="0 0 920 600" xmlns="http://www.w3.org/2000/svg" font-family="ui-sans-serif, system-ui, sans-serif">
<title>Raspberry Pi IR blaster driver schematic</title>
<desc>GPIO18 drives a 220 ohm gate resistor into a logic-level N-channel MOSFET (with a 10k gate pulldown). The MOSFET low-side switches an array of series IR LEDs fed from a separate 12V supply through current-limit resistors. Pi ground and 12V ground are common.</desc>
<rect x="0" y="0" width="920" height="600" fill="#ffffff"/>
<style>
  .wire{stroke:#2a2a2a;stroke-width:2;fill:none;}
  .pwr{stroke:#c0603a;stroke-width:2.5;fill:none;}
  .box{fill:#f4f1ec;stroke:#8a8a8a;stroke-width:1.5;}
  .lbl{fill:#2a2a2a;font-size:14px;}
  .sub{fill:#6a6a6a;font-size:11px;}
  .val{fill:#2a2a2a;font-size:12px;font-weight:600;}
  .node{fill:#2a2a2a;}
  .rail{fill:#c0603a;font-size:12px;font-weight:600;}
</style>
<line class="pwr" x1="560" y1="70" x2="880" y2="70"/>
<text class="rail" x="600" y="62">+12 V  (tower supply)</text>
<line class="wire" x1="40" y1="540" x2="880" y2="540" stroke-width="2.5"/>
<text class="sub" x="360" y="558">COMMON GROUND  —  Pi GND and 12 V return tied together</text>
<rect class="box" x="40" y="150" width="180" height="230" rx="6"/>
<text class="lbl" x="60" y="178" font-weight="600">Raspberry Pi</text>
<text class="sub" x="60" y="196">+ proto/terminal HAT</text>
<text class="sub" x="60" y="214">pigpiod running</text>
<circle class="node" cx="220" cy="250" r="4"/>
<text class="val" x="128" y="246" text-anchor="end">GPIO18</text>
<text class="sub" x="128" y="260" text-anchor="end">(phys pin 12)</text>
<circle class="node" cx="220" cy="340" r="4"/>
<text class="val" x="150" y="336" text-anchor="end">GND</text>
<line class="wire" x1="220" y1="250" x2="290" y2="250"/>
<polyline class="wire" points="290,250 298,240 314,260 330,240 346,260 362,240 370,250"/>
<text class="val" x="330" y="228" text-anchor="middle">R1  220 Ω</text>
<text class="sub" x="330" y="284" text-anchor="middle">gate drive</text>
<line class="wire" x1="370" y1="250" x2="470" y2="250"/>
<circle class="node" cx="470" cy="250" r="4"/>
<line class="wire" x1="470" y1="250" x2="470" y2="300"/>
<polyline class="wire" points="470,300 460,308 480,324 460,340 480,356 460,372 470,380"/>
<text class="val" x="500" y="345">R2  10 kΩ</text>
<text class="sub" x="500" y="360">gate pulldown</text>
<line class="wire" x1="470" y1="380" x2="470" y2="540"/>
<line class="wire" x1="470" y1="250" x2="560" y2="250"/>
<line class="wire" x1="590" y1="215" x2="590" y2="285" stroke-width="3"/>
<line class="wire" x1="560" y1="250" x2="578" y2="250"/>
<line class="wire" x1="578" y1="222" x2="578" y2="278" stroke-width="3"/>
<line class="wire" x1="590" y1="222" x2="620" y2="222"/>
<line class="wire" x1="620" y1="222" x2="620" y2="150"/>
<line class="wire" x1="590" y1="278" x2="620" y2="278"/>
<line class="wire" x1="620" y1="278" x2="620" y2="540"/>
<polygon class="node" points="600,262 612,268 600,274"/>
<text class="lbl" x="640" y="250" font-weight="600">Q1</text>
<text class="sub" x="640" y="266">AO3400A</text>
<text class="sub" x="640" y="280">logic-level N-FET</text>
<text class="sub" x="640" y="296">(J_IR0 / J_IR1)</text>
<text class="sub" x="556" y="212">G</text>
<text class="sub" x="626" y="168">D</text>
<text class="sub" x="626" y="316">S</text>
<line class="wire" x1="620" y1="150" x2="700" y2="150"/>
<text class="sub" x="655" y="142" text-anchor="middle">to LED cathode</text>
<polygon class="wire" points="700,150 700,130 724,140" fill="none"/>
<line class="wire" x1="724" y1="128" x2="724" y2="152"/>
<line class="wire" x1="700" y1="150" x2="700" y2="140"/>
<line class="wire" x1="724" y1="140" x2="748" y2="140"/>
<polygon class="wire" points="748,150 748,130 772,140" fill="none"/>
<line class="wire" x1="772" y1="128" x2="772" y2="152"/>
<line class="wire" x1="772" y1="140" x2="792" y2="140"/>
<text class="val" x="736" y="118" text-anchor="middle">2× IR LED (850 nm)</text>
<text class="sub" x="736" y="176" text-anchor="middle">series string</text>
<line class="wire" x1="792" y1="140" x2="792" y2="110"/>
<polyline class="wire" points="792,110 802,102 818,118 834,102 850,118 860,110"/>
<text class="val" x="826" y="98" text-anchor="middle">R3</text>
<line class="wire" x1="860" y1="110" x2="860" y2="70"/>
<circle class="node" cx="860" cy="70" r="4"/>
<rect x="690" y="96" width="180" height="96" rx="8" fill="none" stroke="#8a8a8a" stroke-dasharray="4 4"/>
<text class="sub" x="780" y="210" text-anchor="middle">repeat this string ×3–4 per tower blaster (parallel)</text>
<rect class="box" x="620" y="470" width="150" height="50" rx="6"/>
<text class="lbl" x="695" y="492" text-anchor="middle" font-weight="600">12 V PSU</text>
<text class="sub" x="695" y="508" text-anchor="middle">≥ 3 A per tower</text>
<line class="pwr" x1="770" y1="484" x2="820" y2="484"/>
<line class="pwr" x1="820" y1="484" x2="820" y2="70"/>
<text class="rail" x="828" y="300">+12 V</text>
<line class="wire" x1="695" y1="520" x2="695" y2="540"/>
</svg>
